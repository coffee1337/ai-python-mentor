# Production stack: one command brings up API, web, workers, runner, PostgreSQL,
# reverse proxy with TLS and (optionally) monitoring.
#
#   cp .env.prod.example .env.prod && $EDITOR .env.prod
#   docker compose -f compose.prod.yml --env-file .env.prod up -d
#
# Only Caddy publishes ports. The API, database and runner stay on the internal
# network, and the runner never receives AI keys or database credentials.
name: ai-python-mentor

x-api-common: &api-common
  build:
    context: ./apps/api
  env_file: .env.prod
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp:size=32m,nosuid,nodev,noexec"]

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  migrate:
    <<: *api-common
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  seed-check:
    <<: *api-common
    restart: "no"
    command: ["python", "-m", "app.seed_check"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  api:
    <<: *api-common
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: production
      COOKIE_SECURE: "true"
    volumes:
      # mTLS client material and the reviewed policy digest, prepared on the host
      # by scripts/runner-docker-bootstrap.py (see docs/RUNBOOK.md).
      - ./ops/runner-config:/etc/ai-tutor/api:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  execution-worker:
    <<: *api-common
    command: ["python", "-m", "app.jobs"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EXECUTION_JOBS_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  notification-worker:
    <<: *api-common
    command: ["python", "-m", "app.notifications"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  runner:
    build:
      context: ./apps/runner
    restart: unless-stopped
    env_file: .env.runner
    environment:
      RUNNER_STATE_DIR: /var/lib/ai-tutor-runner
      RUNNER_BIND: 0.0.0.0
    volumes:
      - runner_state:/var/lib/ai-tutor-runner
      - ./ops/runner-config:/etc/ai-tutor-runner:ro
    read_only: true
    tmpfs: ["/tmp:size=32m,nosuid,nodev,noexec,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8443),2)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      # The worker refuses to serve until the independent reaper proves it is alive;
      # starting it first removes the crash-loop on a cold start.
      runner-reaper:
        condition: service_started
    networks: [internal]

  runner-reaper:
    build:
      context: ./apps/runner
    restart: unless-stopped
    env_file: .env.runner
    environment:
      RUNNER_STATE_DIR: /var/lib/ai-tutor-runner
    # The image defines ENTRYPOINT, so `command` would be appended as arguments and
    # the container would run the HTTP server instead of the watchdog.
    entrypoint: ["python", "-m", "runner_worker.reaper"]
    volumes:
      - runner_state:/var/lib/ai-tutor-runner
      - ./ops/runner-config:/etc/ai-tutor-runner:ro
    read_only: true
    tmpfs: ["/tmp:size=8m,nosuid,nodev,noexec,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [internal]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=32m,nosuid,nodev,noexec", "/app/.next/cache:size=64m,nosuid,nodev,noexec,uid=10001,gid=10001"]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
    networks: [internal]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks: [internal]

volumes:
  postgres_data:
  runner_state:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
