name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r apps/api/requirements.lock
      - run: pip install "ruff==0.17.4"
      # Lint runs on the whole Python surface: API, runner and helper scripts.
      - run: ruff check apps scripts
      # Most tests override get_db with SQLite; PostgreSQL locking is checked below.
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: apps/api

  web:
    name: Web types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - name: Rich text renderer regression
        run: timeout 10s node ../../scripts/check-rich-text.cjs
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  browser:
    name: Beginner journey and responsive browser UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # This file is disposable and belongs only to this job.
      DATABASE_URL: sqlite:////tmp/mentor-browser-ci.sqlite3
      APP_ENV: development
      COOKIE_SECURE: "false"
      WEB_ORIGINS: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://127.0.0.1:8000
      UI_ARTIFACT_DIR: ${{ github.workspace }}/scripts/ui-smoke/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            scripts/ui-smoke/package-lock.json
      - run: python -m pip install -r apps/api/requirements.lock
      - run: python -m alembic upgrade head
        working-directory: apps/api
      - name: Prepare experienced learners for coding recovery
        run: python scripts/ui-smoke/seed-recovery.py
        env:
          RUN_BROWSER_FIXTURES: "1"
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      # Playwright stays in a separate, pinned test-only package.
      - run: npm ci
        working-directory: scripts/ui-smoke
      - run: bash "${{ github.workspace }}/scripts/ci/playwright-install.sh"
        working-directory: scripts/ui-smoke
      - run: npm test
        working-directory: scripts/ui-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-ui-desktop-mobile
          path: scripts/ui-smoke/artifacts/
          retention-days: 14
          if-no-files-found: warn

  execution:
    name: Learner code runs in the isolated runner (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:////tmp/mentor-browser-ci.sqlite3
      APP_ENV: development
      COOKIE_SECURE: "false"
      WEB_ORIGINS: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://127.0.0.1:8000
      EXECUTION_JOBS_ENABLED: "true"
      EXECUTION_E2E: "1"
      UI_ARTIFACT_DIR: ${{ github.workspace }}/scripts/ui-smoke/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            scripts/ui-smoke/package-lock.json
      - run: pip install -r apps/api/requirements.lock
      - run: python -m alembic upgrade head
        working-directory: apps/api
      # PKI, catalog with hidden tests and the runner environment.
      - run: PYTHONPATH=apps/api python scripts/runner-dev-bootstrap.py .runner-dev
      - run: PYTHONPATH=. RUN_BROWSER_FIXTURES=1 python scripts/ui-smoke/seed-recovery.py
        working-directory: ${{ github.workspace }}
        env:
          APP_ENV: development
      - run: npm ci && npm run build
        working-directory: apps/web
      - name: Start runner, reaper and execution worker
        run: |
          set -euo pipefail
          set -a && . .runner-dev/env.sh && set +a
          nohup bash -c 'cd apps/runner && exec python -m runner_worker.reaper' > /tmp/reaper.log 2>&1 &
          # The worker refuses to start without a fresh reaper heartbeat: wait for it.
          for i in $(seq 1 60); do
            [ -f "$RUNNER_STATE_DIR/reaper-heartbeat" ] && break
            sleep 1
          done
          nohup bash -c 'cd apps/runner && exec python -m runner_worker.server' > /tmp/runner.log 2>&1 &
          nohup bash -c 'cd apps/api && exec python -m app.jobs' > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/8443) 2>/dev/null; then exec 3<&-; break; fi
            sleep 1
          done
          if ! grep -q "Traceback" /tmp/runner.log 2>/dev/null; then echo "runner started"; else cat /tmp/runner.log; exit 1; fi
      - run: npm ci
        working-directory: scripts/ui-smoke
      - run: bash "${{ github.workspace }}/scripts/ci/playwright-install.sh"
        working-directory: scripts/ui-smoke
      - name: Browser execution scenario
        working-directory: scripts/ui-smoke
        run: |
          set -euo pipefail
          set -a && . "$GITHUB_WORKSPACE/.runner-dev/env.sh" && set +a
          npx playwright test execution.spec.mjs
      - name: Runner logs on failure
        if: failure()
        run: tail -n 200 /tmp/runner.log /tmp/worker.log /tmp/reaper.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-e2e
          path: scripts/ui-smoke/artifacts/
          retention-days: 14
          if-no-files-found: warn

  migrations:
    name: Migration round trip
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mentor
          POSTGRES_USER: mentor
          POSTGRES_PASSWORD: mentor_local_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mentor -d mentor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r apps/api/requirements.lock
      - name: Upgrade and downgrade on real PostgreSQL
        working-directory: apps/api
        env:
          # URL-encoded credentials must survive Alembic's ConfigParser layer.
          DATABASE_URL: postgresql+psycopg://mentor:m%65ntor_local_only@localhost:5432/mentor
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade 0001_initial
          alembic upgrade head
          alembic check
          python ../../scripts/migration-sentinel.py create
          alembic downgrade 0031_knowledge_chunks
          alembic upgrade head
          alembic check
          python ../../scripts/migration-sentinel.py verify
          python ../../scripts/migration-sentinel.py create
          alembic downgrade 0038_study_drafts
          alembic upgrade head
          python ../../scripts/migration-sentinel.py verify
      - name: PostgreSQL concurrency and evidence
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://mentor:mentor_local_only@localhost:5432/mentor
          RUN_POSTGRES_TESTS: "1"
        run: python -m pytest -q -s tests/test_postgres_specific.py
  runner:
    name: Runner isolation, policy and journal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      # The catalog test imports the authored content, and the mTLS test speaks
      # the wire protocol with httpx, so the API deps are required here too.
      - run: pip install -r apps/api/requirements.lock
      - run: python -m unittest discover -s apps/runner/tests -v
  runner-container:
    name: Learner code in containers (gVisor and kernel parity)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r apps/api/requirements.lock
      # The production backend isolates the guest on a user-space kernel. If this
      # step cannot provide runsc, the job fails loudly instead of degrading.
      - name: Install gVisor (runsc)
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
          runsc --version
      - name: Prepare the container host
        run: |
          sudo mkdir -p /var/lib/ai-tutor-runner
          sudo chown "$USER" /var/lib/ai-tutor-runner
          python scripts/runner-docker-bootstrap.py --state-dir /var/lib/ai-tutor-runner --require-gvisor --github-env
      - name: Escapes, catalog and backend parity
        env:
          RUNNER_DOCKER_FULL: "1"
        run: python -m unittest apps.runner.tests.test_docker_backend apps.runner.tests.test_landlock_sandbox -v
      - name: Host state on failure
        if: failure()
        run: |
          docker ps -a
          docker images
          free -m
          df -h
  windows-encoding:
    name: Windows UTF-8 assets and migrations
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: python -m pip install -r apps/api/requirements.lock
      - run: python -X utf8=0 -m pytest -q tests/test_platform_encoding.py
        working-directory: apps/api
  windows-native:
    name: Windows PowerShell native startup (no Docker)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # The test itself invokes Windows PowerShell 5.1, creates a venv,
      # installs both lockfiles and starts the real API and Next.js proxy.
      - run: python scripts/check-windows-startup.py
        env:
          STARTUP_TEST_PYTHON311: ${{ steps.python311.outputs.python-path }}
